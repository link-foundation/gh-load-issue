name: Checks and release

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      release_mode:
        description: Release mode
        type: choice
        default: checks
        options: [checks, instant, changeset-pr, recover]
      bump_type:
        description: Version bump for instant and changeset-pr modes
        type: choice
        default: patch
        options: [patch, minor, major]
      description:
        description: Manual release description
        type: string
      verbose:
        description: Print additional release diagnostics
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ (github.event_name == 'pull_request' && github.event.action == 'synchronize' && 'latest') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

env:
  BUN_VERSION: '1.4.5'
  NODE_VERSION: '24.22.3'
  HUSKY: '0'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  RELEASE_DEBUG: ${{ inputs.verbose && '1' || '0' }}

jobs:
  plan:
    name: Plan checks and release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan from the tested merge result
        id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          if [[ "$RELEASE_MODE" != "" && "$RELEASE_MODE" != "checks" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run release modes from main. Use checks mode to test a branch."
            exit 1
          fi
          code=true
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            code=false
          fi
          if [[ -n "$PR_BASE_SHA" ]]; then
            git diff --name-only -z "$PR_BASE_SHA" HEAD > "$RUNNER_TEMP/pr-paths"
            code=false
            while IFS= read -r -d '' file; do
              case "$file" in
                dev/log/*) ;;
                .github/*|scripts/*|.changeset/*.md|*.mjs|*.js|*.json|*.lock|*.toml|.husky/*) code=true; break ;;
                *.md|.gitkeep) ;;
                *) code=true; break ;;
              esac
            done < "$RUNNER_TEMP/pr-paths"
          fi
          release=false
          if [[ "$RELEASE_MODE" == "instant" || "$RELEASE_MODE" == "recover" ]]; then
            release=true
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            shopt -s nullglob
            for path in .changeset/*.md; do
              if [[ "$path" != ".changeset/README.md" ]]; then
                release=true
                break
              fi
            done
          fi
          printf 'code=%s\nrelease=%s\n' "$code" "$release" >> "$GITHUB_OUTPUT"

  changeset-check:
    name: Check for Changesets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate PR changesets
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/validate-changeset.mjs

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check

  workflows:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color
      - run: shellcheck --shell=sh .husky/pre-commit
      - run: shellcheck experiments/reproduce-release-recovery.sh
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
          version: v1.33.1
          strict-collection: true
          online-audits: false

  release-preflight:
    name: Verify npm publishing authorization
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: node scripts/setup-npm.mjs
      - run: node scripts/npm-preflight.mjs

  test:
    name: Test (Bun on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: [plan, lint, release-preflight]
    if: ${{ !cancelled() && needs.plan.outputs.code == 'true' && needs.lint.result == 'success' && (needs.plan.outputs.release != 'true' || needs.release-preflight.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Run unit and GitHub integration tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun test

  package-smoke-test:
    name: Test installed npm package (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [plan, lint, release-preflight]
    if: ${{ !cancelled() && needs.plan.outputs.code == 'true' && needs.lint.result == 'success' && (needs.plan.outputs.release != 'true' || needs.release-preflight.result == 'success') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise Changesets before release
        run: |
          shopt -s nullglob
          for path in .changeset/*.md; do
            if [[ "$path" != ".changeset/README.md" ]]; then
              npm run changeset:version
              break
            fi
          done
      - run: bun run test:package

  security-docs:
    name: Secrets and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=moderate --package-lock-only
      - run: bun audit --audit-level moderate
      - run: git ls-files -z | xargs -0 npm exec --no -- secretlint --no-glob --no-gitignore --format github
      - name: Validate primary documentation
        run: |
          for file in README.md REQUIREMENTS.md CHANGELOG.md; do
            if [[ $(wc -l < "$file") -gt 2500 ]]; then
              echo "::error file=$file::Documentation exceeds 2500 lines."
              exit 1
            fi
          done
          grep -qFx '## Installation' README.md
          grep -qFx '## Core Functionality' REQUIREMENTS.md
          grep -qE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          args: --offline README.md REQUIREMENTS.md CHANGELOG.md
          fail: true
      - name: Verify the npm package linked from the README
        if: github.event_name == 'schedule'
        run: npm view gh-load-issue version --registry https://registry.npmjs.org/
      - name: Check public documentation links
        if: github.event_name == 'schedule'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          # The npm website rejects automated requests. The preceding step checks its registry metadata.
          args: --max-retries 2 --exclude '^https://www.npmjs.com/package/gh-load-issue$' README.md REQUIREMENTS.md CHANGELOG.md
          fail: true

  checks:
    name: Required CI checks
    if: ${{ !cancelled() }}
    needs:
      [
        plan,
        changeset-check,
        lint,
        workflows,
        test,
        package-smoke-test,
        security-docs,
        release-preflight,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all applicable jobs to succeed
        env:
          PLAN: ${{ needs.plan.result }}
          CHANGESETS: ${{ needs.changeset-check.result }}
          LINT: ${{ needs.lint.result }}
          WORKFLOWS: ${{ needs.workflows.result }}
          TEST: ${{ needs.test.result }}
          PACKAGE: ${{ needs.package-smoke-test.result }}
          SECURITY_DOCS: ${{ needs.security-docs.result }}
          PREFLIGHT: ${{ needs.release-preflight.result }}
          CODE: ${{ needs.plan.outputs.code }}
          RELEASE: ${{ needs.plan.outputs.release }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          require_result() {
            if [[ "$2" != "success" ]]; then
              echo "::error::$1 concluded $2, expected success."
              return 1
            fi
          }
          require_result plan "$PLAN"
          require_result lint "$LINT"
          require_result workflows "$WORKFLOWS"
          require_result security-docs "$SECURITY_DOCS"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            require_result changeset "$CHANGESETS"
          fi
          if [[ "$RELEASE" == "true" ]]; then
            require_result preflight "$PREFLIGHT"
          fi
          if [[ "$CODE" == "true" ]]; then
            require_result tests "$TEST"
            require_result package "$PACKAGE"
          fi

  release:
    name: Release
    needs: [plan, checks]
    if: needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main'
    concurrency:
      group: npm-release-main
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # zizmor: ignore[artipacked] The version commit must be pushed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/setup-npm.mjs
      - name: Prepare verified version commit
        id: version
        env:
          RELEASE_MODE: ${{ inputs.release_mode || 'changeset' }}
          BUMP_TYPE: ${{ inputs.bump_type }}
          DESCRIPTION: ${{ inputs.description }}
        run: node scripts/version-and-commit.mjs --mode "$RELEASE_MODE"
      - name: Publish the tested npm artifact and verify it from the registry
        run: node scripts/publish-to-npm.mjs
      - name: Create GitHub Release for the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        run: node scripts/create-github-release.mjs

  changeset-pr:
    name: Create Changeset PR
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'changeset-pr' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Create and format the changeset
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          DESCRIPTION: ${{ inputs.description }}
        run: node scripts/create-manual-changeset.mjs
      - name: Verify pull request credentials
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          if [[ -z "$RELEASE_PR_TOKEN" ]]; then
            echo "::error::Set RELEASE_PR_TOKEN to a repository-scoped token with write access to Contents and Pull requests, or add a changeset in a regular pull request."
            exit 1
          fi
      - name: Create draft pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN }}
          add-paths: .changeset/
          commit-message: 'chore: add changeset for manual release'
          branch: changeset-manual-release-${{ github.run_id }}
          delete-branch: true
          draft: true
          title: 'chore: manual ${{ inputs.bump_type }} release'
          body: |
            This PR prepares a **${{ inputs.bump_type }}** release.

            Mark it ready for review to validate the merge result. Merging it to main runs the npm release workflow.
